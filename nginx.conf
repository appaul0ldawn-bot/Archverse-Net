
Production Domain & DNS Mapping Guide

To bind your live staging architecture to your domain name over a production-secure HTTPS connection gateway, configure your external registrar settings:
1. Map the DNS Records: Access your domain registrar panel and add an A Record pointing @ and www directly to the public IP address of your remote staging server instance.
2. Verify Nginx Gateway Blocks: Re-open your nginx.conf orchestration layer script and alter the variable fields to match the real target domains exactly:nginx
server_name yourdomain.com ://yourdomain.com;
Use code with caution.
3. Automate SSL Let's Encrypt Cron Renewals: Certbot signatures expire every 90 days. Keep your secure WSS connections alive without dropouts by adding a background automation script task to check certifications twice daily:bash
crontab -e
# Inject this line into the crontab configuration list:
0 0,12 * * * certbot renew --post-hook "docker-compose restart nginx-proxy"
